<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Time & Leave Tracker</title>
    <meta name="description" content="Secure employee attendance and leave management." />
    <meta name="theme-color" content="#8c2414" />
    <link rel="icon" href="/icon-192.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Older releases registered a cache-first service worker. Remove those
      // registrations and caches once so obsolete hashed assets cannot blank
      // the application after a deployment.
      (async () => {
        if (!('serviceWorker' in navigator)) return;
        const registrations = await navigator.serviceWorker.getRegistrations();
        const cacheNames = 'caches' in window ? await caches.keys() : [];
        if (!registrations.length && !cacheNames.length) return;
        await Promise.all(registrations.map((registration) => registration.unregister()));
        if ('caches' in window) await Promise.all(cacheNames.map((name) => caches.delete(name)));
        window.location.reload();
      })();
    </script>
    <script type="module" src="/src/client/app.jsx"></script>
  </body>
</html>
